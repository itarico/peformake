<style>
/* Layout: catálogo de marcas. Barra de clientes no topo, cada marca é uma ficha com paleta, tipo, aplicações e regras. */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --fg:#1C1B19; --muted:#6B675F; --line:#DEDAD1; --ink-on:#FFFFFF; --focus:#2B59C3;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161614;--surface:#211F1C;--fg:#EEEBE4;--muted:#A39E93;--line:#38352F;--focus:#8FB0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--surface:#211F1C;--fg:#EEEBE4;--muted:#A39E93;--line:#38352F;--focus:#8FB0FF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.top{padding-block:28px 8px}
header.top h1{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
header.top p{margin:6px 0 0;color:var(--muted);max-width:62ch}
nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.bar .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
nav.bar a{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-weight:500;font-size:13px;background:var(--surface)}
nav.bar a img{width:24px;height:24px;border-radius:50%;object-fit:cover}
nav.bar a[aria-current="page"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{padding-block:24px 64px}
.grid13{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none}
.tile .strip{display:flex;height:10px}.tile .strip span{flex:1}
.tile .body{display:flex;gap:12px;align-items:center;padding:14px}
.tile img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.tile b{display:block;font-size:15px}.tile small{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{border-color:#C9822B;color:#A0621A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.warn{color:#E7A85A}}
:root[data-theme="dark"] .pill.warn{color:#E7A85A}
.intro{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
.intro p{margin:0;color:var(--muted);max-width:70ch}
/* ficha */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:22px;border-radius:14px;background:var(--b0);color:var(--bon)}
.hero img{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:12px}
.hero h2{margin:0;font-family:var(--ft);font-size:clamp(28px,5vw,48px);line-height:1.05;text-wrap:balance}
.hero p{margin:8px 0 0;max-width:60ch;font-size:16px;opacity:.92}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .meta span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 9px;opacity:.9}
section.blk{margin-top:30px}
section.blk>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sw button{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sw .chip{height:92px}
.sw .t{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sw .t b{font-size:14px}.sw .t code{font-family:var(--mono);font-size:12.5px}
.sw .t small{color:var(--muted);font-size:12px;line-height:1.35}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.spec .big{font-family:var(--ft);font-size:44px;line-height:1.05;margin:4px 0 8px;overflow-wrap:anywhere}
.spec .body{font-family:var(--fb);font-size:16px;max-width:52ch}
.spec .name{font-family:var(--mono);font-size:12px;color:var(--muted)}
.traits{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
.traits span{padding:5px 12px;border-radius:999px;background:var(--b0);color:var(--bon);font-weight:700;font-size:13px}
.apps{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.mock{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 28px -14px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;padding:7%}
.mock.feed{width:min(300px,100%);aspect-ratio:4/5}
.mock.story{width:min(200px,100%);aspect-ratio:9/16;padding:8% 8% 0}
.mock .bar{height:8px;width:38%;border-radius:2px}
.mock h5{margin:0;font-family:var(--ft);font-size:30px;line-height:1.02;text-wrap:balance;font-weight:800}
.mock.story h5{font-size:22px}
.mock p{margin:8px 0 0;font-family:var(--fb);font-size:13.5px;line-height:1.35;font-weight:600}
.mock.story p{font-size:11px}
.mock .lg{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:8px;align-self:flex-start}
.mock.story .lg{width:40px;height:40px}
.mock .safe{position:absolute;left:0;right:0;border:1px dashed rgba(255,255,255,.7);pointer-events:none}
.mock .safe.t{top:0;height:14%;background:rgba(0,0,0,.18)}
.mock .safe.b{bottom:0;height:35%;background:rgba(0,0,0,.18)}
.mock .safe em{position:absolute;left:6px;bottom:4px;font-size:9px;color:#fff;font-style:normal;letter-spacing:.05em}
.mock.story .content{display:flex;flex-direction:column;gap:6px;margin-top:14%}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
ul.rules li{display:grid;grid-template-columns:18px 1fr;gap:8px}
ul.rules li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:6px}
ul.do li::before{background:#2F8F4E}ul.dont li::before{background:#C23B30}
.pend{border-left:3px solid #C9822B}
.pend ul.rules li::before{background:#C9822B}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero img{width:88px;height:88px}.spec .big{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fam=f=>`'${f}',system-ui,sans-serif`;
function lum(h){const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2]}
const onColor=h=>lum(h)>.42?"#141414":"#FFFFFF";
function nav(cur){
  $("#nav").innerHTML=`<a href="#todos" ${cur==="todos"?'aria-current="page"':""}>Todos</a>`+B.map(c=>`<a href="#${c.id}" ${cur===c.id?'aria-current="page"':""}><img src="${c.logo}" alt="">${esc(c.nome)}</a>`).join("");
  const a=$("#nav [aria-current]"); if(a) a.scrollIntoView({block:"nearest",inline:"center"});
}
function overview(){
  return `<div class="view"><div class="intro"><p>Cada ficha traz essência, voz, paleta, tipografia, grafismo, direção de foto, layout, o que fazer, o que evitar e o que falta confirmar com o cliente. Infinity Graff e Natalia de Menudo estão como provisórias porque a ficha deles está vazia no sistema.</p></div>
  <div class="grid13">${B.map(c=>`<a class="tile" href="#${c.id}"><div class="strip">${c.cores.map(k=>`<span style="background:${k.hex}"></span>`).join("")}</div>
  <div class="body"><img src="${c.logo}" alt="Logo ${esc(c.nome)}"><div><b>${esc(c.nome)}</b><small>${esc(c.segmento)}</small><div style="margin-top:6px"><span class="pill ${/provis|aproxim|prioridade/.test(c.status)?"warn":""}">${esc(c.status)}</span></div></div></div></a>`).join("")}</div></div>`;
}
function mock(c,kind){
  const e=c.exemplo,bg=c.cores[e.fundo].hex,fg=c.cores[e.texto].hex,d=c.cores[e.destaque].hex;
  if(kind==="feed") return `<div><div class="mock feed" style="background:${bg};color:${fg}"><div class="bar" style="background:${d}"></div><div><h5>${esc(e.titulo)}</h5><p>${esc(e.apoio)}</p></div><img class="lg" src="${c.logo}" alt=""></div><div class="cap">Feed 1080 × 1350</div></div>`;
  return `<div><div class="mock story" style="background:${bg};color:${fg}"><div class="safe t"><em>14% livre</em></div><div class="content"><img class="lg" src="${c.logo}" alt=""><div class="bar" style="background:${d}"></div><h5>${esc(e.titulo)}</h5><p>${esc(e.apoio)}</p></div><div class="safe b"><em>35% livre (interface)</em></div></div><div class="cap">Story / Reels 1080 × 1920</div></div>`;
}
function ficha(c){
  const p=c.cores[0].hex;
  return `<div class="view" style="--b0:${p};--bon:${onColor(p)};--ft:${fam(c.fontes.titulo)};--fb:${fam(c.fontes.apoio)}">
  <div class="hero"><img src="${c.logo}" alt="Logo ${esc(c.nome)}"><div><h2>${esc(c.nome)}</h2><p>${esc(c.essencia)}</p><div class="meta"><span>${esc(c.segmento)}</span><span>${esc(c.status)}</span></div></div></div>
  <section class="blk"><h3>Paleta</h3><div class="sw">${c.cores.map(k=>`<button type="button" data-hex="${k.hex}" aria-label="Copiar ${k.hex}"><div class="chip" style="background:${k.hex};${k.hex.toUpperCase()==="#FFFFFF"?"box-shadow:inset 0 -1px 0 var(--line)":""}"></div><div class="t"><b>${esc(k.nome)}</b><code>${k.hex}</code><small>${esc(k.uso)}</small></div></button>`).join("")}</div></section>
  <section class="blk"><h3>Tipografia</h3><div class="two"><div class="card spec"><div class="name">Título · ${esc(c.fontes.titulo)}</div><div class="big">${esc(c.exemplo.titulo)}</div><div class="name">Apoio · ${esc(c.fontes.apoio)}</div><div class="body">${esc(c.exemplo.apoio)} Texto de apoio sempre curto, solto, logo abaixo do título.</div></div>
  <div class="card"><h4>Personalidade</h4><div class="traits">${c.personalidade.map(t=>`<span>${esc(t)}</span>`).join("")}</div><h4>Tom de voz</h4><p style="margin:0">${esc(c.voz)}</p><p class="cap">${esc(c.fontes.nota)}</p></div></div></section>
  <section class="blk"><h3>Aplicação</h3><div class="apps">${mock(c,"feed")}${mock(c,"story")}</div></section>
  <section class="blk"><h3>Linguagem visual</h3><div class="two"><div class="card"><h4>Grafismo da marca</h4><p style="margin:0">${esc(c.grafismo)}</p></div><div class="card"><h4>Fotografia</h4><p style="margin:0">${esc(c.foto)}</p></div><div class="card"><h4>Layout</h4><p style="margin:0">${esc(c.layout)}</p></div></div></section>
  <section class="blk"><h3>Regras</h3><div class="two"><div class="card"><h4>Faça</h4><ul class="rules do">${c.faca.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="card"><h4>Evite</h4><ul class="rules dont">${c.evite.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></section>
  <section class="blk"><h3>Confirmar com o cliente</h3><div class="card pend"><ul class="rules">${c.pendencias.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section></div>`;
}
function route(){
  const id=(location.hash||"#todos").slice(1); const c=B.find(x=>x.id===id);
  nav(c?c.id:"todos"); $("#app").innerHTML=c?ficha(c):overview();
  if(c) window.scrollTo({top:0});
}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-hex]"); if(!b) return; const h=b.dataset.hex;
  const t=$("#toast"); const show=m=>{t.textContent=m;t.hidden=false;clearTimeout(show.k);show.k=setTimeout(()=>t.hidden=true,1600)};
  try{navigator.clipboard.writeText(h).then(()=>show(h+" copiado"),()=>show(h))}catch(e){show(h)}});
addEventListener("hashchange",route); route();
</script>
