<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Noto+Serif+SC:wght@900&family=Courier+Prime:wght@700&family=Inter:wght@600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#EFE4CC;position:relative;font-family:'Cormorant Garamond',serif;color:#1A1714}
.camada{position:absolute;inset:0}
.papel{background:radial-gradient(ellipse at 50% 45%,rgba(255,250,235,.9) 0%,rgba(239,228,204,0) 55%),#EFE4CC}
.fibras{opacity:.18;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='f'><feTurbulence type='turbulence' baseFrequency='.004 .09' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .15  0 0 0 .7 0'/></filter><rect width='900' height='900' filter='url(%23f)'/></svg>")}
.grao{inset:-200px;opacity:.34;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .6 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>")}
.vinheta{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(60,38,10,.45) 100%);pointer-events:none}
.heroi{position:absolute;background-size:cover;background-position:center;box-shadow:14px 22px 40px rgba(50,30,5,.45)}
.rasgado{clip-path:polygon(0 1%,4% 0,9% 1.2%,15% .3%,22% 1%,30% 0,38% 1.1%,47% .2%,55% 1%,63% 0,71% 1.3%,80% .4%,88% 1%,95% 0,100% 1%,99.2% 8%,100% 17%,99.3% 27%,100% 38%,99.4% 50%,100% 61%,99.2% 72%,100% 83%,99.4% 93%,100% 99%,94% 100%,86% 99%,77% 100%,68% 99.2%,59% 100%,50% 99%,41% 100%,32% 99.1%,23% 100%,14% 99%,6% 100%,0 99%,.7% 90%,0 80%,.8% 68%,0 56%,.6% 44%,0 33%,.8% 21%,0 10%)}
.manchete{font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:.95}
.data{font-family:'Courier Prime';font-weight:700;letter-spacing:2px;color:#B3261E}
.han{font-family:'Noto Serif SC';font-weight:900}
.legenda{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-family:'Inter';font-weight:600;font-size:34px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px #000}
.selo{position:absolute;width:118px;height:118px;border:6px solid #B3261E;color:#B3261E;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC';font-weight:900;font-size:44px;line-height:1;border-radius:8px;text-align:center}
.cena{position:absolute;inset:0;transform-origin:50% 50%}
.bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,245,220,.55),rgba(255,245,220,0) 70%)}
.poeira{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(60,40,15,.45)}
</style></head><body>
<div class="camada papel" id="papel"></div><div class="camada fibras"></div>

<!-- Cena A: abertura (tumba) -->
<div class="cena" id="A">
  <div class="heroi rasgado" id="A_tumba" style="left:170px;top:150px;width:1050px;height:700px;background-image:url(TUMBA)"></div>
  <div class="heroi" id="A_caixao" style="left:1180px;top:560px;width:520px;height:390px;background-image:url(CAIXAO);border:14px solid #F7F1E3"></div>
  <div style="position:absolute;left:1290px;top:150px;width:520px">
    <div class="data" id="A_data" style="font-size:34px"></div>
    <div class="manchete" id="A_man" style="font-size:84px;margin-top:14px"></div></div>
  <div class="selo" id="A_selo" style="left:1700px;top:420px">墓</div>
  <div class="legenda" id="A_leg">Em 1973, no sul da China, arqueólogos abriram uma tumba...</div>
</div>

<!-- Cena B: rolo de trás para frente -->
<div class="cena" id="B">
  <div class="heroi rasgado" id="B_cima" style="left:520px;top:120px;width:380px;height:420px;background-image:url(MS);background-position:center 0%"></div>
  <div class="heroi rasgado" id="B_baixo" style="left:520px;top:530px;width:380px;height:420px;background-image:url(MS);background-position:center 100%"></div>
  <svg id="B_seta" style="position:absolute;left:930px;top:250px" width="150" height="560" viewBox="0 0 150 560"><defs><filter id="r"><feTurbulence baseFrequency=".04" numOctaves="2"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter></defs>
   <g filter="url(#r)" fill="none" stroke="#B3261E" stroke-width="9" stroke-linecap="round"><path id="B_seta_p" d="M20 60 C 120 140, 120 420, 30 500" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path id="B_seta_c" d="M30 500 l 34 -6 M30 500 l 8 -32" opacity="0"/></g></svg>
  <div class="han" id="B_te" style="position:absolute;left:400px;top:330px;font-size:120px">德</div>
  <div class="han" id="B_tao" style="position:absolute;left:400px;top:690px;font-size:120px">道</div>
  <div style="position:absolute;left:1120px;top:330px;width:700px">
    <div class="data" id="B_data" style="font-size:30px">MAWANGDUI · 168 a.C.</div>
    <div class="manchete" id="B_man" style="font-size:112px;margin-top:18px">De trás<br>para <span style="color:#B3261E">frente</span></div>
    <div id="B_sub" style="font-size:40px;font-style:italic;margin-top:26px">o Te vinha antes do Tao</div></div>
  <div class="selo" id="B_selo" style="left:1640px;top:110px">道德<br>經</div>
  <div class="legenda" id="B_leg">Ele estava de trás para frente.</div>
</div>

<!-- Cena C: diagrama wu wei -->
<div class="cena" id="C">
  <svg style="position:absolute;inset:0" width="1920" height="1080" viewBox="0 0 1920 1080"><defs>
   <filter id="tinta"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
   <filter id="tinta2"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="8"/></filter></defs>
   <g filter="url(#tinta)" id="C_pedra" style="transform-origin:1000px 530px"><path d="M 900 420 C 990 330, 1090 360, 1110 470 C 1130 580, 1040 660, 950 640 C 860 620, 820 500, 900 420 Z" fill="#1A1714" opacity=".92"/></g>
   <g filter="url(#tinta2)" fill="none" stroke-linecap="round">
    <path id="C_forca" d="M 200 380 L 840 470" stroke="#B3261E" stroke-width="22" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <path id="C_trinca" d="M 845 445 l 40 -40 M 850 480 l 50 10 M 840 500 l 20 45" stroke="#B3261E" stroke-width="9" opacity="0"/>
    <path id="C_agua" d="M 200 720 C 600 720, 760 760, 880 760 C 1050 760, 1150 690, 1240 640 C 1360 575, 1500 600, 1720 640" stroke="#3F6B5A" stroke-width="22" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <path id="C_ponta" d="M 1690 610 l 40 30 l -46 22" stroke="#3F6B5A" stroke-width="12" opacity="0"/></g></svg>
  <div id="C_l1" style="position:absolute;left:200px;top:300px" class="manchete"><span style="font-size:52px;color:#B3261E">Forçar</span></div>
  <div id="C_l2" style="position:absolute;left:200px;top:770px" class="manchete"><span style="font-size:52px;color:#3F6B5A">Contornar</span></div>
  <div style="position:absolute;right:160px;top:150px;text-align:right"><div class="han" id="C_han" style="font-size:150px;line-height:1">無為</div>
   <div class="manchete" id="C_ww" style="font-size:64px;margin-top:10px">Wu wei</div><div id="C_sub" style="font-size:38px;font-style:italic">agir sem forçar</div></div>
  <div class="selo" id="C_selo" style="left:120px;top:90px">水</div>
  <div class="legenda" id="C_leg">Ela não vence a pedra no choque. Ela vence porque não para.</div>
</div>

<div class="camada" id="bokeh"></div>
<div class="camada" id="poeira"></div>
<div class="camada grao" id="grao"></div>
<div class="camada vinheta"></div>

<!-- Transição 1: tinta que se espalha -->
<svg id="tinta_tr" class="camada" width="1920" height="1080" viewBox="0 0 1920 1080" style="pointer-events:none"><defs>
 <filter id="borda" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2800" height="1900"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="140"/></filter></defs>
 <g filter="url(#borda)"><circle id="tinta_c" cx="1700" cy="900" r="0" fill="#1A1714"/><circle id="tinta_c2" cx="1500" cy="700" r="0" fill="#1A1714"/></g></svg>
<!-- Transição 2: pincelada -->
<svg id="pincel_tr" class="camada" width="1920" height="1080" viewBox="0 0 1920 1080" style="pointer-events:none"><defs>
 <filter id="cerda" filterUnits="userSpaceOnUse" x="-600" y="-900" width="3200" height="2900"><feTurbulence type="fractalNoise" baseFrequency=".9 .015" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="90"/></filter></defs>
 <g filter="url(#cerda)"><path id="pincel_p" d="M -200 560 C 400 420, 1300 700, 2150 520" stroke="#1A1714" stroke-width="1500" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g></svg>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const out = t => 1-Math.pow(1-t,3);
const seg = (t,a,b)=>clamp((t-a)/(b-a));
function rnd(i){ const x=Math.sin(i*12.9898)*43758.5453; return x-Math.floor(x); }
// bokeh e poeira fixos (posições pseudoaleatórias)
const bk=$('bokeh'), po=$('poeira');
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='bokeh';const s=120+rnd(i)*220;d.style.width=d.style.height=s+'px';d.dataset.x=rnd(i+20)*1920;d.dataset.y=rnd(i+40)*1080;d.dataset.v=(0.3+rnd(i+60))*18;bk.appendChild(d);}
for(let i=0;i<60;i++){const d=document.createElement('div');d.className='poeira';d.dataset.x=rnd(i+100)*1920;d.dataset.y=rnd(i+200)*1080;d.dataset.v=(rnd(i+300)-.5)*14;d.dataset.w=4+rnd(i+400)*10;po.appendChild(d);}
function tipo(el, txt, p){ el.textContent = txt.slice(0, Math.round(txt.length*clamp(p))); }
function show(el,p,dy=24){ el.style.opacity=clamp(p); el.style.transform=`translateY(${(1-out(clamp(p)))*dy}px)`; }

window.render = function(t){
  // cenas: A 0-6, tinta 5.4-7.4 (troca em 6.4), B 6.4-13, pincel 12.4-14.2 (troca em 13.3), C 13.3-20
  const cenaA = t<6.4, cenaB = t>=6.4 && t<13.3, cenaC = t>=13.3;
  $('A').style.display=cenaA?'block':'none'; $('B').style.display=cenaB?'block':'none'; $('C').style.display=cenaC?'block':'none';

  // câmera: push lento + deriva; profundidade de campo: fundo desfoca levemente, herói nítido
  let ini = cenaA?0:cenaB?6.4:13.3, fim = cenaA?6.4:cenaB?13.3:20, p=(t-ini)/(fim-ini);
  const cam = cenaA? 1.10-0.10*ease(p) : 1.0+0.05*p;
  const dx = (p-.5)*(cenaC?-20:30);
  for(const id of ['A','B','C']) $(id).style.transform=`scale(${cam}) translateX(${dx}px)`;
  $('papel').style.transform=`scale(${1+0.02*p}) translateX(${dx*0.4}px)`; $('papel').style.filter=`blur(${1.5+p*1.5}px)`;

  // CENA A
  if(cenaA){
    $('A_tumba').style.filter=`blur(${(1-out(seg(t,0,1.2)))*14}px)`; // foco rack
    $('A_tumba').style.transform=`rotate(-1.5deg)`;
    const pc=out(seg(t,2.2,3.0)); $('A_caixao').style.opacity=pc; $('A_caixao').style.transform=`translate(${(1-pc)*260}px,${(1-pc)*60}px) rotate(${4+(1-pc)*14}deg)`;
    tipo($('A_data'),'CHANGSHA · 1973',seg(t,0.6,1.6));
    $('A_man').innerHTML = ['Fechada','há mais de','dois mil','anos'].map((w,i)=>`<span style="display:inline-block;opacity:${seg(t,1.4+i*.35,1.8+i*.35)};transform:translateY(${(1-out(seg(t,1.4+i*.35,1.8+i*.35)))*30}px)">${w}</span>`).join(' ');
    const ps=seg(t,3.6,3.9); $('A_selo').style.opacity=ps>0?1:0; $('A_selo').style.transform=`rotate(-6deg) scale(${1.7-0.7*out(ps)})`;
    show($('A_leg'),seg(t,0.2,0.6),10);
  }
  // CENA B
  if(cenaB){
    const tb=t-6.4;
    // o rolo começa inteiro (metade de cima em cima) e as metades trocam de lugar em arco
    const sw=ease(seg(tb,1.6,3.0));
    const yC = 120 + sw*410, yB = 530 - sw*410, arco=Math.sin(sw*Math.PI)*120;
    $('B_cima').style.top=yC+'px'; $('B_baixo').style.top=yB+'px';
    $('B_cima').style.transform=`translateX(${-arco}px) rotate(${-2.5+sw*1}deg)`; $('B_baixo').style.transform=`translateX(${arco}px) rotate(${1.5-sw*1}deg)`;
    $('B_seta_p').style.strokeDashoffset = 1-out(seg(tb,1.4,2.6)); $('B_seta_c').style.opacity=seg(tb,2.5,2.7);
    $('B_te').style.opacity=seg(tb,3.0,3.5); $('B_tao').style.opacity=seg(tb,3.2,3.7);
    $('B_te').style.top=(330+0)+'px';
    show($('B_data'),seg(tb,.3,.8)); show($('B_man'),seg(tb,.5,1.3),40); show($('B_sub'),seg(tb,3.6,4.2));
    const ps=seg(tb,4.4,4.7); $('B_selo').style.opacity=ps>0?.9:0; $('B_selo').style.transform=`rotate(-6deg) scale(${1.7-0.7*out(ps)})`;
    show($('B_leg'),seg(tb,0.1,.5),10);
    $('B_cima').style.filter=`blur(${(1-out(seg(tb,0,0.8)))*10}px)`; $('B_baixo').style.filter=$('B_cima').style.filter;
  }
  // CENA C
  if(cenaC){
    const tc=t-13.3;
    const pr=out(seg(tc,.6,1.4)); $('C_pedra').style.transform=`scale(${pr})`;
    $('C_forca').style.strokeDashoffset=1-out(seg(tc,1.4,2.6));
    const choque=seg(tc,2.6,3.2); $('C_trinca').style.opacity=choque>0?1:0;
    const tre = choque>0&&choque<1 ? Math.sin(tc*90)*6*(1-choque) : 0; $('C_pedra').style.transform=`scale(${pr}) translateX(${tre}px)`;
    $('C_agua').style.strokeDashoffset=1-ease(seg(tc,3.2,5.4)); $('C_ponta').style.opacity=seg(tc,5.3,5.5);
    show($('C_l1'),seg(tc,1.2,1.6)); show($('C_l2'),seg(tc,3.0,3.4));
    $('C_han').style.clipPath=`inset(0 ${100-100*out(seg(tc,.2,1.4))}% 0 0)`; show($('C_ww'),seg(tc,1.0,1.5)); show($('C_sub'),seg(tc,1.3,1.8));
    const ps=seg(tc,5.6,5.9); $('C_selo').style.opacity=ps>0?.9:0; $('C_selo').style.transform=`rotate(-6deg) scale(${1.7-0.7*out(ps)})`;
    show($('C_leg'),seg(tc,0.1,.5),10);
  }
  // TRANSIÇÃO 1: tinta que se espalha do canto e recolhe para o centro
  const ti=seg(t,5.4,6.4), to=seg(t,6.4,7.4);
  $('tinta_c').setAttribute('r', t<6.4 ? 2600*ease(ti) : 2600*(1-ease(to)));
  $('tinta_c2').setAttribute('r', t<6.4 ? 1400*ease(seg(t,5.6,6.4)) : 0);
  $('tinta_c').setAttribute('cx', t<6.4?1700:960); $('tinta_c').setAttribute('cy', t<6.4?900:540);
  // TRANSIÇÃO 2: pincelada que varre e se desfaz
  const bi=seg(t,12.4,13.3), bo=seg(t,13.3,14.2);
  $('pincel_p').style.strokeDashoffset = 1-ease(bi);
  $('pincel_tr').style.opacity = t<13.3 ? 1 : 1-ease(bo);
  // textura viva: grão muda a cada quadro, bokeh desfocado à frente (profundidade), poeira flutuando
  const f=Math.round(t*24);
  $('grao').style.transform=`translate(${-Math.floor(rnd(f)*200)}px,${-Math.floor(rnd(f+7)*200)}px)`;
  for(const d of bk.children){const x=(+d.dataset.x + t*d.dataset.v)%2100-90;d.style.left=x+'px';d.style.top=(+d.dataset.y+Math.sin(t*.5+ +d.dataset.x)*20)+'px';d.style.filter='blur(18px)';d.style.opacity=.55;}
  for(const d of po.children){d.style.left=((+d.dataset.x + t*d.dataset.v*3)%1920+1920)%1920+'px';d.style.top=((+d.dataset.y - t*8)%1080+1080)%1080+'px';d.style.width=d.style.height=(+d.dataset.w/3)+'px';d.style.filter=`blur(${d.dataset.w>9?2:0}px)`;}
  document.body.style.filter=`brightness(${1+Math.sin(t*7)*0.012+ (rnd(f)-.5)*0.01})`;
}
window.render(0);
</script></body></html>
