<!doctype html><html><head><meta charset="utf-8">
<style>

.vinheta{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(60,38,10,.42) 100%);pointer-events:none}
#cena{position:absolute;inset:0;transform-origin:50% 50%}
.heroi{position:absolute;background-size:cover;background-position:center;box-shadow:14px 22px 40px rgba(50,30,5,.45)}

.manchete{font-weight:700;letter-spacing:2px;text-transform:uppercase;line-height:.95}
.data{font-family:'Courier Prime';font-weight:700;letter-spacing:2px;color:#B3261E}
.han{font-family:'Noto Serif SC';font-weight:900}
.selo{position:absolute;width:118px;height:118px;border:6px solid #B3261E;color:#B3261E;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC';font-weight:900;font-size:44px;line-height:1;border-radius:8px;text-align:center;opacity:.9}

#barra{position:absolute;left:420px;right:420px;bottom:250px;height:3px;background:rgba(26,23,20,.3);transition:none}

#barra em{position:absolute;top:18px;transform:translateX(-50%);font-family:'Courier Prime';font-style:normal;font-size:18px;white-space:nowrap}

</style></head><body>
<div class="camada" id="papel"></div><div class="camada fibras" id="fib"></div>
<div id="cena"></div>
<div class="camada" id="poeira"></div>

<div id="barra"></div><div id="ilus">ilustração</div>

<svg id="tinta_tr" class="camada" width="1920" height="1080" viewBox="0 0 1920 1080" style="pointer-events:none"><defs>
 <filter id="borda" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2800" height="1900"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="140"/></filter></defs>
 <g filter="url(#borda)"><circle id="tc" cx="1700" cy="900" r="0" fill="#1A1714"/></g></svg>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>clamp((t-a)/(Math.max(b-a,1e-6)));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, out=t=>1-Math.pow(1-t,3);
function rnd(i){const x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x);}
const po=$('poeira'); for(let i=0;i<50;i++){const d=document.createElement('div');d.style.cssText='position:absolute;border-radius:50%;background:rgba(60,40,15,.45)';d.dataset.x=rnd(i+100)*1920;d.dataset.y=rnd(i+200)*1080;d.dataset.v=(rnd(i+300)-.5)*14;d.dataset.w=1+rnd(i+400)*3;po.appendChild(d);}
let PROJ=null, cenaAtual=-1;
const EP=[['c. 500 a.C.',0],['300 a.C.',.17],['168 a.C.',.33],['733',.5],['1788',.67],['anos 1970',.84],['hoje',1]];
EP.forEach(([n,x],i)=>{const d=document.createElement('i');d.style.left=(x*100)+'%';d.id='ep'+i;$('barra').appendChild(d);const e=document.createElement('em');e.textContent=n;e.style.left=(x*100)+'%';$('barra').appendChild(e);});
function show(el,p,dy=24){if(!el)return;el.style.opacity=clamp(p);el.style.transform=`translateY(${(1-out(clamp(p)))*dy}px)`;}
function selo(el,p){if(!el)return;el.style.opacity=p>0?.9:0;el.style.transform=`rotate(-6deg) scale(${1.7-0.7*out(p)})`;}
function palavras(txt,t,a,step){return txt.split(' ').map((w,i)=>`<span style="display:inline-block;opacity:${seg(t,a+i*step,a+i*step+.4)};transform:translateY(${(1-out(seg(t,a+i*step,a+i*step+.4)))*26}px)">${w}</span>`).join(' ');}

// ---------- tipos de cena: monta(c) cria o DOM; anima(c,t,d) move no tempo local t (0..d) ----------
const T={
 foto_mesa:{ // foto real recortada no papel + data + manchete (estilo aprovado)
  monta:c=>`<div class="heroi rasgado" id="h" style="left:${c.lado==='dir'?760:150}px;top:150px;width:1000px;height:680px;background-image:url(${c.img})"></div>
   ${c.img2?`<div class="heroi" id="h2" style="left:${c.lado==='dir'?150:1180}px;top:560px;width:520px;height:380px;background-image:url(${c.img2});border:14px solid #F7F1E3"></div>`:''}
   <div style="position:absolute;${c.lado==='dir'?'left:150px':'left:1250px'};top:170px;width:520px"><div class="data" id="d" style="font-size:32px"></div><div class="manchete" id="m" style="font-size:${c.tam||80}px;margin-top:14px"></div></div>

  anima:(c,t,d)=>{$('h').style.filter=`blur(${(1-out(seg(t,0,.9)))*12}px)`;$('h').style.transform=`rotate(${c.lado==='dir'?1.5:-1.5}deg)`;
   if($('h2')){const p=out(seg(t,1.2,2));$('h2').style.opacity=p;$('h2').style.transform=`translate(${(1-p)*200}px,${(1-p)*50}px) rotate(${4+(1-p)*12}deg)`;}
   $('d').textContent=(c.data||'').slice(0,Math.round((c.data||'').length*seg(t,.3,1.2)));$('m').innerHTML=palavras(c.titulo||'',t,.6,.22);selo($('s'),seg(t,1.8,2.1));}},

   $('te').style.opacity=seg(t,d*.25+1.4,d*.25+1.9);$('tao').style.opacity=seg(t,d*.25+1.6,d*.25+2.1);show($('d'),seg(t,.2,.7));show($('m'),seg(t,.4,1.2),40);show($('sub'),seg(t,d*.25+2,d*.25+2.6));selo($('s'),seg(t,d*.25+2.6,d*.25+2.9));}},

   <path id="f2" d="M 845 445 l 40 -40 M 850 480 l 50 10 M 840 500 l 20 45" stroke="#B3261E" stroke-width="9" opacity="0"/>

  anima:(c,t,d)=>{const k=d/8;const pr=out(seg(t,.4*k,1.2*k));const ch=seg(t,2.4*k,3*k);const tre=ch>0&&ch<1?Math.sin(t*90)*6*(1-ch):0;
   $('pd').style.transform=`scale(${pr}) translateX(${tre}px)`;$('f1').style.strokeDashoffset=1-out(seg(t,1.2*k,2.4*k));$('f2').style.opacity=ch>0?1:0;
   $('f3').style.strokeDashoffset=1-ease(seg(t,3*k,5.4*k));$('f4').style.opacity=seg(t,5.3*k,5.5*k);show($('l1'),seg(t,1*k,1.4*k));show($('l2'),seg(t,2.8*k,3.2*k));
   $('hn').style.clipPath=`inset(0 ${100-100*out(seg(t,0,1.2))}% 0 0)`;show($('ww'),seg(t,.8,1.3));show($('sb'),seg(t,1.1,1.6));}},

window.carregar=function(proj){PROJ=proj;};
window.render=async function(tg){
  const cs=PROJ.cenas; let i=cs.findIndex(c=>tg>=c.ini&&tg<c.fim); if(i<0)i=cs.length-1; const c=cs[i];
  if(i!==cenaAtual){$('cena').innerHTML=T[c.tipo].monta(c);cenaAtual=i;document.body.className=(c.tipo==='video_cheio'||c.tipo==='pintura'||c.tipo==='frase_tinta')?'escuro':'';$('ilus').style.display=c.ilustracao?'block':'none';}
  const tl=tg-c.ini,d=c.fim-c.ini;
  // câmera: push lento por cena (2,5D)
  const p=tl/d; if(c.tipo!=='video_cheio'&&c.tipo!=='pintura'&&c.tipo!=='frase_tinta'){$('cena').style.transform=`scale(${1.06-.06*ease(p)}) translateX(${(p-.5)*24}px)`;}else{$('cena').style.transform='none';}
  T[c.tipo].anima(c,tl,d);
  // vídeo real: toca em vaivém se o clipe for mais curto que a cena; mapa 3D (hold) para no último quadro
  if(c.frames){const N=c.frames.n,k=Math.floor(tl*24);let n;if(c.frames.hold)n=Math.min(N-1,k);else{const P=2*N-2;const m=k%P;n=m<N?m:P-m;}const v=$('v');const src=c.frames.dir+'/'+String(n+1).padStart(5,'0')+'.jpg';if(v&&v.dataset.s!==src){v.dataset.s=src;await new Promise(r=>{v.onload=r;v.onerror=r;v.src=src;});}}
  // legenda: a frase falada agora
  const f=PROJ.frases.find(x=>tg>=x.ini&&tg<x.fim+.25); const lg=$('leg'); if(lg.dataset.t!==(f?f.texto:'')){lg.dataset.t=f?f.texto:'';lg.innerHTML=f?`<span>${f.texto.replace(/</g,'&lt;')}</span>`:'';}
  // barra de linha do tempo: aparece nas cenas com época
  const ep=c.epoca; $('barra').style.opacity=ep!=null?1:0; EP.forEach((e,k)=>$('ep'+k).className=(ep!=null&&k<=ep)?'on':'');
  // transição de tinta nos limites de bloco
  let r=0; for(const b of PROJ.blocos){const dd=tg-b; if(dd>-0.9&&dd<0){r=2600*ease(seg(dd,-0.9,0));} else if(dd>=0&&dd<0.9){r=2600*(1-ease(seg(dd,0,0.9)));}}
  $('tc').setAttribute('r',r);
  // textura viva
  const fr=Math.round(tg*24); $('grao').style.transform=`translate(${-Math.floor(rnd(fr)*200)}px,${-Math.floor(rnd(fr+7)*200)}px)`;
  for(const dp of po.children){dp.style.left=((+dp.dataset.x+tg*dp.dataset.v*3)%1920+1920)%1920+'px';dp.style.top=((+dp.dataset.y-tg*8)%1080+1080)%1080+'px';dp.style.width=dp.style.height=dp.dataset.w+'px';}
  document.body.style.filter=`brightness(${1+Math.sin(tg*7)*.01})`;
  return i;
};
